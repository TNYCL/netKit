[workspace]
members = ["crates/netkit", "crates/netkit-cli", "crates/netkit-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["netKit contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
libloading = "0.8"
libc = "0.2"
quick-xml = "0.42"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
toml = "0.8"
ipnet = "2.12"
netkit = { path = "crates/netkit" }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
