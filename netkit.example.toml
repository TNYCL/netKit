# netKit: scans are explicit commands; capture is passive.
[engine]
max_flows = 4096
max_devices = 16384
max_flow_bytes = 1048576
max_total_bytes = 67108864
max_message_bytes = 1048576
max_packet_bytes = 2097152
max_events_per_packet = 256
flow_timeout_seconds = 120
fragment_timeout_seconds = 30
emit_packets = false
include_sensitive = false
